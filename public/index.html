<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Icons — 你的专属私人定制版</title>
    <style>
        :root { --bg: #fff; --card: #fff; --text: #111; --border: #e1e4e8; --footer: #f6f8fa; }
        [data-theme="dark"] { --bg: #111; --card: #1a1a1a; --text: #eee; --border: #2d333b; --footer: #22272e; }
        body { font-family: "Inter", monospace; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; transition: background 0.15s; }
        .container { max-width: 1200px; margin: 0 auto; }
        header h1 { font-size: 2.2rem; margin: 0 0 10px 0; }
        header .subtitle { font-size: 1.1rem; color: #555; margin: 0 0 40px 0; }
        [data-theme="dark"] header .subtitle { color: #8b949e; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; margin-bottom: 30px; font-size: 14px; font-weight: bold; }
        .tool-group { display: flex; flex-direction: column; gap: 8px; }
        .btn-set { display: flex; border: 1px solid var(--text); border-radius: 4px; overflow: hidden; }
        .btn-set button { background: var(--bg); color: var(--text); border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; outline: none; }
        .btn-set button.active { background: var(--text); color: var(--bg); }
        .search-wrapper { flex: 1; min-width: 280px; }
        .search-box { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 4px; background: var(--card); color: var(--text); box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; height: 190px; cursor: pointer; overflow: hidden; }
        .card:hover { border-color: var(--text); }
        .icon-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .icon-body svg { width: 44px; height: 44px; margin-bottom: 16px; }
        .icon-title { font-size: 13px; margin: 0; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .card-footer { display: flex; height: 32px; border-top: 1px solid var(--border); background: var(--footer); }
        .color-pill { flex: 1; display: flex; align-items: center; padding-left: 10px; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .footer-btn { width: 32px; border: none; background: transparent; border-left: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
        [data-theme="dark"] .footer-btn { color: #768390; }
        .footer-btn:hover { background: var(--text); color: var(--bg); }
        .footer-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 10px 20px; border-radius: 4px; font-size: 12px; font-weight: bold; opacity: 0; transform: translateY(100px); transition: 0.3s; z-index: 1000; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Simple Icons</h1>
        <div class="subtitle">3453 SVG icons for popular brands</div>
    </header>
    <div class="toolbar">
        <div class="tool-group search-wrapper"><label>Search</label><input type="text" id="search" class="search-box" placeholder="Search by brand..."></div>
        <div class="tool-group"><label>Order</label><div class="btn-set" id="orderSet"><button class="active" data-order="az">A-Z</button><button data-order="color">Color</button></div></div>
        <div class="tool-group"><label>Theme</label><div class="btn-set" id="themeSet"><button class="active" data-theme-btn="light">☀️</button><button data-theme-btn="dark">🌙</button></div></div>
        <div class="tool-group"><label>Download</label><div class="btn-set" id="downloadSet"><button class="active" data-type="svg">SVG</button><button data-type="png">PNG</button></div></div>
    </div>
    <div class="grid" id="iconGrid"></div>
</div>
<div class="toast" id="toast">COPIED!</div>
<canvas id="convertCanvas" style="display:none;" width="512" height="512"></canvas>
<script>
    let iconsData = [], currentOrder = 'az', currentDownloadType = 'svg';
    const grid = document.getElementById('iconGrid'), toast = document.getElementById('toast');

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1500); }

    function triggerDownload(icon) {
        const filename = `${icon.title.toLowerCase().replace(/\s+/g, '-')}.${currentDownloadType}`;
        const svgString = `<svg role="img" viewBox="0 0 24 24" xmlns="http://w3.org" fill="#${icon.hex}"><path d="${icon.path}"/></svg>`;
        if (currentDownloadType === 'svg') {
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            execDownload(URL.createObjectURL(blob), filename, 'SVG DOWNLOADED!');
        } else {
            const canvas = document.getElementById('convertCanvas'), ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const img = new Image(), svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }), url = URL.createObjectURL(svgBlob);
            img.onload = function () {
                ctx.drawImage(img, 0, 0, 512, 512); URL.revokeObjectURL(url);
                execDownload(canvas.toDataURL('image/png'), filename, 'PNG DOWNLOADED!');
            };
            img.src = url;
        }
    }

    function execDownload(url, filename, msg) {
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast(msg);
    }

    function renderGrid() {
        let data = [...iconsData];
        const searchVal = document.getElementById('search').value.toLowerCase().trim();
        if (searchVal) data = data.filter(i => i.title.toLowerCase().includes(searchVal));
        if (currentOrder === 'az') data.sort((a, b) => a.title.localeCompare(b.title));
        else if (currentOrder === 'color') data.sort((a, b) => a.hex.localeCompare(b.hex));

        grid.innerHTML = '';
        data.forEach(icon => {
            const card = document.createElement('div'); card.className = 'card';
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const renderHex = (isDark && icon.hex === '000000') ? 'ffffff' : icon.hex;
            const svgMarkup = `<svg role="img" viewBox="0 0 24 24" xmlns="http://w3.org" fill="#${renderHex}"><path d="${icon.path}"/></svg>`;

            card.innerHTML = `
                <div class="icon-body">${svgMarkup}<h2 class="icon-title">${icon.title}</h2></div>
                <div class="card-footer">
                    <div class="color-pill" style="background: #${icon.hex};">#${icon.hex}</div>
                    <button class="footer-btn action-search"><svg viewBox="0 0 16 16"><path d="M11.5 7a4.499 4.499 0 11-8.998 0A4.499 4.499 0 0111.5 7zm-.82 4.74a6 6 0 111.414-1.414l3.393 3.393a1 1 0 01-1.414 1.414l-3.393-3.393z"/></svg></button>
                    <button class="footer-btn action-dl"><svg viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h10a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/><path d="M7.646 11.854a.5.5 0 00.708 0l3-3a.5.5 0 00-.708-.708L8.5 10.293V1.5a.5.5 0 00-1 0v8.793L5.354 8.146a.5.5 0 10-.708.708l3 3z"/></svg></button>
                </div>`;

            card.addEventListener('click', () => { navigator.clipboard.writeText(svgMarkup).then(() => showToast('COPIED SVG!')); });
            card.querySelector('.action-dl').addEventListener('click', (e) => { e.stopPropagation(); triggerDownload(icon); });
            card.querySelector('.action-search').addEventListener('click', (e) => { e.stopPropagation(); window.open(`https://google.com{encodeURIComponent(icon.title)}`, '_blank'); });
            grid.appendChild(card);
        });
    }

    // 异步加载分离的数据集文件
    fetch('data.json').then(res => res.json()).then(json => { iconsData = json; renderGrid(); });

    document.getElementById('orderSet').addEventListener('click', (e) => { const b = e.target.closest('button'); if(b){ document.querySelectorAll('#orderSet button').forEach(x => x.classList.remove('active')); b.classList.add('active'); currentOrder = b.dataset.order; renderGrid(); } });
    document.getElementById('themeSet').addEventListener('click', (e) => { const b = e.target.closest('button'); if(b){ document.querySelectorAll('#themeSet button').forEach(x => x.classList.remove('active')); b.classList.add('active'); document.documentElement.setAttribute('data-theme', b.dataset.themeBtn); renderGrid(); } });
    document.getElementById('downloadSet').addEventListener('click', (e) => { const b = e.target.closest('button'); if(b){ document.querySelectorAll('#downloadSet button').forEach(x => x.classList.remove('active')); b.classList.add('active'); currentDownloadType = b.dataset.type; } });
    document.getElementById('search').addEventListener('input', renderGrid);
</script>
</body>
</html>
